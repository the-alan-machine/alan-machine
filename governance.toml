# Who looks after the book (GOVERNANCE.md). People are named by GitHub handle, without @.
#
# Maintainers look after the whole repository and merge pull requests. Moderators look after a
# part of the book: they review the changes to its pages and triage its issues. Curators look
# after single pages and are listed in each page's front matter (`curators: [...]`).
#
# Every part in _quarto.yml has one entry here, by its exact title. A change to this file needs a
# maintainer.

