# Concepts: every technical term the book uses, defined in plain language.
# tools/generate.py turns this file into the Concepts appendix (appendices/concepts.qmd).
# Link a concept from any page with @sec-concept-<id>; the generator lists where it is used.
#
# Fields: id (lowercase, hyphens), term, short (one line), definition (plain language),
# related (concept ids), references (keys in references.bib).

[[concept]]
id = "entropy"
term = "Entropy"
short = "How many microscopic arrangements fit what we see at large scale, on a logarithmic scale."
definition = """
A measure of how many microscopic arrangements of a system (its microstates) are compatible with
what we observe at large scale (its macrostate). The more ways the parts can be arranged without
changing how the whole looks, the higher the entropy. It grows with the logarithm of that number:
the entropy is $k_B$ times its natural logarithm, so doubling the number of arrangements adds
$k_B \\ln 2$, however large the system. Thermodynamics measures the same quantity through heat: heat
taken in reversibly at temperature $T$, divided by $T$, is the change in entropy.
"""
related = ["second-law", "arrow-of-time", "bit"]
references = []

[[concept]]
id = "second-law"
term = "Second law of thermodynamics"
short = "In an isolated system, entropy does not decrease."
definition = """
In an isolated system, entropy does not decrease over time. It is a statistical law: a decrease is
not forbidden, only overwhelmingly unlikely for systems with many parts.
"""
related = ["entropy", "arrow-of-time", "maxwells-demon"]
references = []

[[concept]]
id = "arrow-of-time"
term = "Arrow of time"
short = "The difference between past and future that we observe."
definition = """
The difference between past and future that we observe in everyday life: eggs break but do not
unbreak, and we remember yesterday but not tomorrow. It stands out because the fundamental laws of
physics barely distinguish between the two directions of time.
"""
related = ["entropy", "second-law"]
references = []

[[concept]]
id = "poincare-recurrence"
term = "Poincaré recurrence"
short = "A finite system comes back arbitrarily close to where it started, given a very long time."
definition = """
A theorem of Henri Poincaré: any finite system comes arbitrarily close to its initial state after
some very long but finite time. Taken statistically it is not a paradox, but it seems to violate the
second law of thermodynamics, since the entropy of a gas would in time return near its starting
value. The theorem leaves gravity out; with gravity, colliding particles can form black holes, which
can quench the recurrence or change how long it takes.
"""
related = ["second-law", "entropy", "arrow-of-time"]
references = ["dong2016gravity"]

[[concept]]
id = "bit"
term = "Bit"
short = "A binary digit, and the usual name of the unit of information, the shannon."
definition = """
The word has two meanings that are kept apart. A bit is a binary digit: one place in a memory or a
message that holds 0 or 1, so ten such places hold ten bits. It is also the everyday name of the
unit of information, whose own name is the shannon (symbol Sh). Learning which of two equally likely
answers is the true one gives one shannon; an answer that could be predicted gives less, and a
certain one gives none. So ten binary digits carry at most ten shannons, and exactly ten only when
every sequence is equally likely. Claude Shannon set out the measure in 1948: the logarithm to base
2 of the number of equally likely possibilities. Taken with the natural logarithm instead, the same
information is measured in nats, and one shannon is $\\ln 2$ nat, about 0.693 nat. The shannon is
the unit named in the standard IEC 80000-13:2025. Entropy in thermodynamics is $k_B$ times the
information in nats, which is why Landauer's bound for erasing one bit, $k_B T \\ln 2$, carries the
factor $\\ln 2$: it converts one shannon into nats.
"""
related = ["landauer-principle", "entropy"]
references = ["shannon1948mathematical"]

[[concept]]
id = "landauer-principle"
term = "Landauer's principle"
short = "Erasing one bit costs at least k_B T ln 2 of heat."
definition = """
Erasing one bit of information in surroundings at temperature $T$ releases at least $k_B T \\ln 2$
of heat. Forgetting has a minimum physical cost. The bound was proposed by Rolf Landauer in 1961
and confirmed experimentally in 2012.
"""
related = ["bit", "reversible-computing", "maxwells-demon"]
references = ["landauer1961irreversibility", "berut2012experimental"]

[[concept]]
id = "reversible-computing"
term = "Reversible computing"
short = "Computing without erasing information, so every step can be undone."
definition = """
Computing without erasing information, so that every step can be run backward. Two meanings are
kept apart. A computation is logically reversible when each state has only one possible
predecessor, so the input can be recovered from the output; Charles Bennett showed in 1973 that a
general-purpose computer can be made logically reversible at every step. It is thermodynamically
reversible when it produces no entropy, a limit a real device approaches only by running ever more
slowly. Logical reversibility removes the minimum cost that Landauer's principle sets on erasure;
it does not by itself remove the rest of the dissipation.
"""
related = ["landauer-principle", "bit"]
references = ["bennett1973logical"]

[[concept]]
id = "maxwells-demon"
term = "Maxwell's demon"
short = "A tiny sorter of molecules that seems to beat the second law."
definition = """
A thought experiment devised by James Clerk Maxwell in 1867: a tiny being opens and closes a door
between two boxes of gas, letting fast molecules go one way and slow ones the other. It seems to
lower entropy for free. The accepted resolution is that the demon must record what it sees, and
erasing that record eventually pays the entropy back.
"""
related = ["second-law", "landauer-principle"]
references = []

[[concept]]
id = "szilard-engine"
term = "Szilard engine"
short = "Maxwell's demon reduced to one molecule in a box."
definition = """
The simplest case of Maxwell's demon, studied by Leo Szilard in 1929: a box holding a single
molecule, in thermal contact with a heat bath, and a partition that can be inserted and can slide
along the box. With the partition inserted, the molecule pushes on it; if it moves the way it is
pushed, it can lift a weight, and the most work this extracts is $k_B T \\ln 2$, drawn from the
heat bath alone. Szilard argued that the second law is saved if the demon's acquisition of
knowledge, which side the molecule is on, comes with a compensating entropy cost.
"""
related = ["maxwells-demon", "landauer-principle", "second-law"]
references = ["maroney2009information"]

[[concept]]
id = "turing-machine"
term = "Turing machine"
short = "Turing's 1936 model of what it means to compute."
definition = """
An abstract model of computation introduced by Alan Turing in 1936: a machine that reads and writes
symbols on an unlimited tape, following a finite table of rules. Anything a modern computer can
compute, a Turing machine can compute too, given enough time and tape.
"""
related = ["bit"]
references = ["turing1937computable"]

[[concept]]
id = "quantum-speed-limit"
term = "Quantum speed limit"
short = "The shortest time in which a quantum system can change into a fully distinguishable state."
definition = """
The shortest time in which a quantum system can evolve into a state fully distinguishable from the
one it started in. Leonid Mandelstam and Igor Tamm bounded it by the spread of the system's energy;
Norman Margolus and Lev Levitin, in 1998, by its average energy above the lowest possible: the time
is at least $\\pi\\hbar / 2E$, with $E$ measured from the ground state. Each step of a computation
has to reach a distinguishable state, so the limit caps how many steps per second a computer with a
given energy can take.
"""
related = ["bit", "reversible-computing"]
references = ["mandelstam1991uncertainty", "margolus1998maximum", "lloyd2000ultimate"]

[[concept]]
id = "closed-timelike-curve"
term = "Closed timelike curve"
short = "A path through spacetime that returns to its own past."
definition = """
A path through spacetime that returns to its own past. Such curves are not known to exist, but
studying them has taught something about general relativity and quantum information. Following
David Deutsch, a closed timelike curve is treated as a region of spacetime where nature must produce
a consistent outcome: a fixed point of whatever process runs around the loop. Aaronson and Watrous
showed in 2008 that, if such curves existed, quantum computers would be no more powerful than
classical ones: both could solve exactly the problems that need a polynomial amount of memory
(PSPACE).
"""
related = ["arrow-of-time"]
references = ["deutsch1991quantum", "aaronson2008closed"]
