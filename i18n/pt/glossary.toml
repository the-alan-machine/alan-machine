# The terms of the book in Portuguese (Brazil). A translator uses these words for these terms, so
# that one English term reads the same on every page; i18n/pt/strings.toml uses them too. A change
# is proposed in a translation pull request and approved by the language maintainers.
#
# Fields:
#   en     the English term
#   text   the Portuguese term
#   note   when to use it, or why this word and not another
#
# Conventions that are not terms:
#   - Numbers, units and dates stay as the English writes them, except the decimal mark, which is
#     a comma (1.5 becomes 1,5; in math, 1{,}5). Math, citation keys and labels never change.
#   - Alan is a name, and so are The Alan Machine and Escape Velocity.
#   - The titles of sources are never translated, and neither are quotes.
#   - The titles of claim callouts are the ones of i18n/pt/strings.toml [claims].
#   - GitHub terms stay in English: pull request, issue, fork, commit.

[[term]]
en = "book"
text = "livro"

[[term]]
en = "chapter"
text = "capítulo"

[[term]]
